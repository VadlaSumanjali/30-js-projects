<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:black;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;
        }

        .calculator{
            width:300px;
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:10px;
            background:#111;
            padding:20px;
            border-radius:10px;
        }

        #display{
            grid-column:span 4;
            height:60px;
            font-size:24px;
            text-align:right;
            padding:10px;
            border:none;
            outline:none;
            background:#222;
            color:white;
        }

        button{
            height:60px;
            font-size:20px;
            border:none;
            cursor:pointer;
            background:#333;
            color:white;
            border-radius:5px;
        }

        button:hover{
            background:#555;
        }

    </style>
</head>

<body>

<div class="calculator">

    <input type="text" id="display" readonly >

    <button onclick="cal('AC')">AC</button>
    <button onclick="cal('C')">C</button>
    <button  onclick="cal('%')">%</button>
    <button onclick="cal('/')">/</button>

    <button onclick="cal('7')">7</button>
    <button onclick="cal('8')">8</button>
    <button onclick="cal('9')">9</button>
    <button onclick="cal('*')">*</button>

    <button onclick="cal('4')">4</button>
    <button onclick="cal('5')">5</button>
    <button onclick="cal('6')">6</button>
    <button onclick="cal('-')">-</button>

    <button onclick="cal('1')">1</button>
    <button onclick="cal('2')">2</button>
    <button onclick="cal('3')">3</button>
    <button onclick="cal('+')">+</button>

    <button onclick="cal('0')">0</button>
    <button onclick="cal('00')">00</button>
    <button onclick="cal('.')">.</button>
    <button onclick="cal('=')">=</button>

</div>
<script>
    let show=""
    function cal(val){
        let display=document.getElementById("display")
        //show+=val
        // display.value=show
        if(val==='AC'){
            show=""
            display.value=""
        }else if(val === 'C'){
            show=show.slice(0,-1);
            display.value = show;
           // console.log(show)
        }else if(val === '='){
            try{
                show = eval(show).toString();
                display.value = show;
            }catch{
                display.value = "Error";
                show = "";
            }
        }else{
            show += val;
            display.value = show;

        }
    }
</script>
</body>
</html>
