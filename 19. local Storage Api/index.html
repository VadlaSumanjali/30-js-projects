<script>
    const savedcoloe=localStorage.getItem("color");
    if(savedcoloe){
        document.body.style.backgroundColor=savedcoloe
    }
    function change(){
        if(document.body.style.backgroundColor==="black"){
            document.body.style.backgroundColor="white"
        }else{
            document.body.style.backgroundColor="black"

        }
