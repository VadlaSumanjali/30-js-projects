<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>😂 Random Joke Generator</h1>

        <div class="joke-box">
            <p id="setup">Click the button to get a joke</p>
            <p id="punchline"></p>
        </div>

        <button id="btn">Get Joke</button>
    </div>

    <script>
        const btn=document.getElementById("btn")
        const punchline=document.getElementById("punchline")
        const setup=document.getElementById("setup")
        btn.addEventListener("click",async ()=>{
            try{
                setup.textContent="loading......"
                punchline.textContent=""
                const joke=await fetch("https://official-joke-api.appspot.com/random_joke")
                const data=await joke.json()
                setup.textContent = data.setup;
                punchline.textContent = data.punchline;
            }
            // fetch("https://official-joke-api.appspot.com/random_joke")
            //    .then((d)=>{
            //     punchline.textContent=d
            //    })
            catch(error){
                console.log(error)
                setup.textContent = "Failed to fetch joke";
            }
        })
    </script>
</body>
</html>
