<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Formatter Tool</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5563d6;
            transform: translateY(-2px);
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 8px;
            line-height: 1.8;
        }

        #result h3 {
            margin-bottom: 10px;
            color: #333;
        }

        #result p {
            color: #555;
        }

        strong {
            color: #222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>String Formatter Tool</h1>

        <textarea
            id="inputText"
            placeholder="Enter text here..."
        ></textarea>

        <button onclick="formatText()">
            Format Text
        </button>

        <div id="result"></div>
    </div>

    <script>
        function formatText() {

            const textArea = document.getElementById("inputText");
            const inputText = textArea.value;
            const result = document.getElementById("result");

            let wordCount =
                inputText.trim() === ""
                ? 0
                : inputText.trim().split(/\s+/).length;

            result.innerHTML = `
                <h3>Results</h3>

                <p>
                    <strong>Original:</strong>
                    ${inputText}
                </p>

                <p>
                    <strong>Uppercase:</strong>
                    ${inputText.toUpperCase()}
                </p>

                <p>
                    <strong>Lowercase:</strong>
                    ${inputText.toLowerCase()}
                </p>

                <p>
                    <strong>Characters:</strong>
                    ${inputText.length}
                </p>

                <p>
                    <strong>Words:</strong>
                    ${wordCount}
                </p>
            `;

            textArea.value = "";
        }
    </script>

</body>
</html>
