<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="clock-container">
        <h1>Digital Clock</h1>

        <h2 id="time"></h2>
        <p id="date"></p>

        <button onclick="toggleFormat()">
            Switch Format
        </button>
    </div>
<script>
let is24Hour=localStorage.getItem("is24hours")==="true";
function update(){
    const now=new Date();
    let time=document.getElementById("time")
    let date=document.getElementById("date")
     
    let hours=now.getHours()
    let minutes=now.getMinutes()
    let seconds=now.getSeconds()

    let sessiom="AM"

    if(!is24Hour){
        if(hours>=12){
            sessiom="PM"
        }
        if(hours>12){
            hours=hours-12;
        }if(hours===0){
            hours=12;
        }
    }  
    
    hours = String(hours).padStart(2,'0');
    minutes = String(minutes).padStart(2,'0');
    seconds =String(seconds).padStart(2,'0');
    time.textContent=`${hours}:${minutes}:${seconds} ${is24Hour ? "":sessiom}`;
    
    const days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];

    const dayName = days[now.getDay()];
    const monthName = months[now.getMonth()];

    const fullDate = `${dayName}, ${monthName} ${now.getDate()}, ${now.getFullYear()}`;

    date.innerText = fullDate;
}
function toggleFormat(){
    is24Hour = !is24Hour;
    localStorage.setItem("is24hours",is24Hour)
    update();
}

setInterval(update,1000)
update()
</script>
</body>
</html>
