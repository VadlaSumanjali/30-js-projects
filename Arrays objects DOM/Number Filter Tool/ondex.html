<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>

    <h1>Student Management System</h1>

    <hr>

    <h2>Add Student</h2>

    <input type="text" id="name" placeholder="Enter Name">

    <input type="number" id="age" placeholder="Enter Age">

    <input type="number" id="marks" placeholder="Enter Marks">

    <button id="addStudentBtn">
        Add Student
    </button>

    <hr>

    <h2>Marks Analysis</h2>

    <button id="totalBtn">
        Total Marks
    </button>

    <button id="averageBtn">
        Average Marks
    </button>

    <button id="highestBtn">
        Highest Marks
    </button>

    <button id="lowestBtn">
        Lowest Marks
    </button>

    <hr>

    <h2>Student Filters</h2>

    <button id="passedBtn">
        Passed Students
    </button>

    <button id="failedBtn">
        Failed Students
    </button>

    <button id="above80Btn">
        Above 80 Marks
    </button>

    <hr>

    <h2>Search Student</h2>

    <input type="text"
           id="searchInput"
           placeholder="Enter Student Name">

    <button id="searchBtn">
        Search
    </button>

    <hr>

    <h2>Grade List</h2>

    <button id="showGradesBtn">
        Show Grades
    </button>

    <hr>

    <h2>Output</h2>

    <div id="output">

    </div>

</body>
</html>
