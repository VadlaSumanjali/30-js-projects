<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#111827;
            color:white;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#38bdf8;
            margin-bottom:20px;
        }

        h2{
            margin-bottom:10px;
        }

        .container{
            max-width:1200px;
            margin:auto;
        }

        .box{
            background:#1f2937;
            padding:20px;
            border-radius:12px;
            margin-bottom:25px;
            box-shadow:0 5px 15px rgba(0,0,0,.3);
        }

        form{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
        }

        input{
            flex:1;
            min-width:180px;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#374151;
            color:white;
            outline:none;
        }

        input::placeholder{
            color:#d1d5db;
        }

        button{
            padding:12px 20px;
            background:#0ea5e9;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
            transition:.3s;
        }

        button:hover{
            background:#0284c7;
            transform:scale(1.05);
        }

        .stats{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .stat-card{
            background:#374151;
            padding:20px;
            border-radius:10px;
            text-align:center;
        }

        .stat-card span{
            display:block;
            margin-top:10px;
            font-size:30px;
            color:#22c55e;
            font-weight:bold;
        }

        #cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            margin-top:20px;
        }

        .student-card{
            background:#374151;
            padding:20px;
            border-radius:10px;
            border-left:5px solid #38bdf8;
            transition:.3s;
        }

        .student-card:hover{
            transform:translateY(-5px);
            box-shadow:0 10px 20px rgba(0,0,0,.4);
        }

        .student-card h3{
            color:#38bdf8;
            margin-bottom:12px;
        }

        .student-card p{
            margin:8px 0;
        }

        #insert{
            text-align:center;
        }

        #joke{
            margin:20px 0;
            color:#facc15;
            line-height:1.6;
            min-height:60px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Management Dashboard</h1>

    <div class="box">
        <form onsubmit="addStudent(event)">
            <input type="text" id="name" placeholder="Student Name" required>

            <input type="number" id="age" placeholder="Age" required>

            <input type="text" id="course" placeholder="Course" required>

            <input type="number" id="marks" placeholder="Marks" required>

            <button type="submit">Add Student</button>
        </form>
    </div>

    <div class="box">
        <h2>Statistics</h2>

        <div class="stats">

            <div class="stat-card">
                Total Students
                <span id="total">0</span>
            </div>

            <div class="stat-card">
                Average Marks
                <span id="average">0</span>
            </div>

            <div class="stat-card">
                Highest Marks
                <span id="highest">0</span>
            </div>

        </div>
    </div>

    <div class="box">
        <h2>Student Cards</h2>

        <div id="cards"></div>
    </div>

    <div class="box" id="insert">
        <h2>💡 Motivation Quote</h2>

        <h3 id="joke"></h3>

        <button onclick="generateJoke()">New Quote</button>
    </div>

</div>

<script>

let arr=[];

function addStudent(event){

    event.preventDefault();

    const name=document.getElementById("name");
    const age=document.getElementById("age");
    const course=document.getElementById("course");
    const marks=document.getElementById("marks");

    let student={
        name:name.value,
        age:Number(age.value),
        course:course.value,
        marks:Number(marks.value)
    };

    arr.push(student);

    name.value="";
    age.value="";
    course.value="";
    marks.value="";

    valueschange();
    studentCard();
}

function studentCard(){

    const cards=document.getElementById("cards");

    cards.innerHTML="";

    arr.forEach((student)=>{

        cards.innerHTML+=`
            <div class="student-card">
                <h3>${student.name}</h3>

                <p><strong>Age:</strong> ${student.age}</p>

                <p><strong>Course:</strong> ${student.course}</p>

                <p><strong>Marks:</strong> ${student.marks}</p>
            </div>
        `;

    });

}

function valueschange(){

    const total=document.getElementById("total");
    const average=document.getElementById("average");
    const highest=document.getElementById("highest");

    if(arr.length===0){

        total.textContent=0;
        average.textContent=0;
        highest.textContent=0;

        return;
    }

    let sum=0;
    let max=arr[0].marks;

    for(let i=0;i<arr.length;i++){

        sum+=arr[i].marks;

        if(arr[i].marks>max){
            max=arr[i].marks;
        }

    }

    total.textContent=arr.length;
    average.textContent=(sum/arr.length).toFixed(2);
    highest.textContent=max;

}

async function generateJoke(){

    const joke=document.getElementById("joke");

    try{

        const res=await fetch("https://dummyjson.com/quotes/random");

        const data=await res.json();

        joke.textContent=`"${data.quote}"`;

    }
    catch(error){

        joke.textContent="Unable to fetch quote.";

        console.log(error);

    }

}

generateJoke();

</script>

</body>
</html>
