<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --surface: rgba(15, 23, 42, 0.92);
            --surface-strong: rgba(30, 41, 59, 0.98);
            --accent: #38bdf8;
            --accent-soft: #7dd3fc;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.25);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            margin: 0;
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.16), transparent 28%),
                        linear-gradient(180deg, #020617 0%, #0c1227 100%);
            color: var(--text);
        }

        body {
            display: grid;
            place-items: center;
            padding: 2rem;
        }

        #insert {
            width: min(100%, 540px);
            padding: 2rem;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(15,23,42,0.96), rgba(30, 41, 59, 0.92));
            box-shadow: 0 28px 80px rgba(15, 23, 42, 0.32);
            backdrop-filter: blur(14px);
            text-align: center;
        }

        button {
            margin: 0 auto 1.75rem;
            padding: 0.95rem 1.9rem;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
            box-shadow: 0 14px 30px rgba(56, 189, 248, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(56, 189, 248, 0.28);
        }

        button:active {
            transform: translateY(0);
            opacity: 0.94;
        }

        #joke {
            margin: 0;
            padding: 1.75rem 1.5rem;
            border-radius: 22px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.16);
            color: var(--text);
            font-size: clamp(1.1rem, 1.8vw, 1.35rem);
            line-height: 1.8;
            min-height: 120px;
            display: grid;
            place-items: center;
        }

        #joke:empty {
            min-height: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div id="insert">
        <button onclick="generateJoke()">joke</button>
        <h2 id="joke"></h2>
    </div>
<script>

    async function generateJoke(){
        const jokes=document.getElementById("joke")
        try{
            const res=await fetch('https://dummyjson.com/quotes/random')
            
                const data=await res.json()
                console.log(data)
                jokes.textContent=`${data.quote}`
            
        }catch(error){
            console.log(error)
        }
    }
</script>
</body>
</html>
