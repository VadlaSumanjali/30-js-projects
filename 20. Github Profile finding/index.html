<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Profile Finder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#121212;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:420px;
    background:#1f1f1f;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    outline:none;
    border-radius:8px;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#238636;
    color:white;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    background:#2ea043;
}

#result{
    text-align:center;
}

img{
    width:130px;
    height:130px;
    border-radius:50%;
    border:4px solid #238636;
    margin-bottom:15px;
}

.info{
    text-align:left;
    margin-top:15px;
}

.info p{
    margin:8px 0;
    font-size:17px;
}

.loading{
    color:gold;
}

.error{
    color:#ff5c5c;
}

.bio{
    margin-top:15px;
    color:#ddd;
    line-height:1.5;
}
</style>

</head>
<body>

<div class="container">

    <h1>GitHub Profile Finder</h1>

    <div class="search-box">
        <input
            type="text"
            id="input"
            placeholder="Enter GitHub Username"
        >

        <button onclick="searchUser()">
            Search
        </button>
    </div>

    <div id="result">

        <p>Search a GitHub User</p>

    </div>

</div>

<script>

async function searchUser(){

    const input=document.getElementById("input");
    const result=document.getElementById("result");

    const username=input.value.trim();

    if(username===""){
        result.innerHTML=`<p class="error">Please enter a username.</p>`;
        return;
    }

    result.innerHTML=`<p class="loading">Loading...</p>`;

    try{

        const response=await fetch(`https://api.github.com/users/${username}`);

        const data=await response.json();

        if(!response.ok){

            result.innerHTML=`
            <p class="error">
                User Not Found
            </p>
            `;

            return;
        }

        result.innerHTML=`

        <img src="${data.avatar_url}" alt="avatar">

        <h2>${data.name || "No Name"}</h2>

        <p>@${data.login}</p>

        <div class="info">

            <p>👥 Followers : ${data.followers}</p>

            <p>➡ Following : ${data.following}</p>

            <p>📂 Public Repositories : ${data.public_repos}</p>

            <p>📍 Location : ${data.location || "Not Available"}</p>

            <p>🌐 Company : ${data.company || "Not Available"}</p>

        </div>

        <p class="bio">
            ${data.bio || "No Bio Available"}
        </p>

        `;

    }

    catch(error){

        result.innerHTML=`
        <p class="error">
            Something went wrong.
        </p>
        `;

    }

    input.value="";

}

</script>

</body>
</html>
